# Faultline reference system: a simulated infusion pump.
# Processes start in this order, so servers exist before their clients.
#
# name         program        priority  heartbeat_ms  restart_limit  faultable
fl-plant       fl-plant       60        200           3              0
flow-sensor    flow-sensor    42        100           50             1
motor-drv      motor-drv      45        100           50             1
pump-ctrl      pump-ctrl      40        100           50             1
fl-inject      fl-inject      50        500           5              0
fl-bridge      fl-bridge      20        1000          5              0
